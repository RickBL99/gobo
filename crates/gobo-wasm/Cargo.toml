[package]
name = "gobo-wasm"
version = "0.1.0"
edition = "2021"
description = "The Rust that runs in Gobo's page and on its server: scrim (read, steal and grade a look), flag (continuity) and dingle (draw to direct), as one WebAssembly module with a tiny C ABI."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scrim = { path = "../scrim" }
flag = { path = "../flag" }
dingle = { path = "../dingle" }
serde_json = "1"
