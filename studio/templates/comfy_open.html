<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening ComfyUI · Gobo</title>
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root { --bg: #0b0b0d; --panel: #131316; --panel2: #1a1a1f; --line: #2a2a31; --line2: #3a3a44;
  --text: #ecebe8; --muted: #9a98a0; --dim: #6c6a73; --accent: #f2c14e; --accent-ink: #1b1505; --bad: #ef8a7a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; }
a { color: var(--accent); }
main { max-width: 560px; margin: 0 auto; padding: clamp(40px, 12vh, 120px) 16px 40px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.02rem; color: var(--text); text-decoration: none; }
.logo svg { width: 28px; height: 28px; }
.card { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 0 0 4px; }
.what { color: var(--muted); font-size: .92rem; margin: 0 0 16px; overflow-wrap: anywhere; }
.state { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
.state.up .dot { background: #7bd88f; animation: none; }
.state.bad .dot { background: var(--bad); animation: none; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.where { font: .86rem ui-monospace, Menlo, monospace; color: var(--muted); margin: 6px 0 0 20px; overflow-wrap: anywhere; }
.help { margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel2); color: #d2d0d6; font-size: .92rem; }
.help p { margin: 0 0 6px; } .help p:last-child { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn { font: 600 .88rem Inter, system-ui, sans-serif; border-radius: 99px; padding: 8px 16px; cursor: pointer;
  border: 1px solid var(--line2); background: var(--panel2); color: var(--text); }
.btn:hover { border-color: #55555f; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.addr { display: flex; gap: 8px; margin-top: 12px; }
.addr input { flex: 1; min-width: 0; font: .9rem ui-monospace, Menlo, monospace; color: var(--text); background: var(--bg);
  border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; }
.hidden { display: none !important; }
code { font: .88em ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
</style>
</head>
<body>
{% include "_superstock.html" %}
<main>
  <a class="logo" href="/">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="9" width="42" height="30" rx="5" fill="none" stroke="#f2c14e" stroke-width="3"/>
      <circle cx="24" cy="24" r="8.5" fill="none" stroke="#ecebe8" stroke-width="3"/><circle cx="24" cy="24" r="3" fill="#f2c14e"/>
      <rect x="8" y="13" width="5" height="3" rx="1" fill="#ecebe8"/></svg>
    Gobo
  </a>
  <div class="card">
    <h1>Opening ComfyUI</h1>
    <p class="what" id="what"></p>
    <div class="state" id="state"><span class="dot"></span><span id="say">Looking for ComfyUI…</span></div>
    <div class="where" id="where"></div>
    <div class="help hidden" id="help"></div>
    <div class="row">
      <button class="btn" id="now">Open it now</button>
      <button class="btn" id="change">Different address?</button>
    </div>
    <div class="addr hidden" id="addr"><input id="addrIn" aria-label="Where your ComfyUI is" spellcheck="false"><button class="btn go" id="addrGo">Use it</button></div>
  </div>
</main>
<script>
// "Open in ComfyUI" opens this tab: it waits for your ComfyUI to answer, then
// hands it the workflow. The workflow rides after the # (gobo=…), so it never
// reaches a server; ComfyUI's Gobo nodes read it from there.
const $ = s => document.querySelector(s);
const H = new URLSearchParams(location.hash.slice(1));
const gobo = H.get("gobo") || "";
let to = (H.get("to") || "").replace(/\/+$/, "");
const STORE = "gobo.comfyui";

const say = (text, how = "") => { $("#say").textContent = text; $("#state").className = `state ${how}`; };
const help = html => { $("#help").innerHTML = html; $("#help").classList.toggle("hidden", !html); };
const target = () => `${to}/#gobo=${gobo}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// what's being opened, from the workflow's own title
try {
  const b = atob(gobo.replace(/-/g, "+").replace(/_/g, "/"));
  const w = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
  if (w.title) $("#what").textContent = w.title;
} catch (e) { /* no title to show */ }

// Chrome asks before a site may reach apps on your own computer ("local
// network access"). Its name for the permission has changed between versions,
// so each is tried; a browser without it answers nothing.
async function permission() {
  for (const name of ["loopback-network", "local-network-access", "local-network"]) {
    try { return (await navigator.permissions.query({ name })).state; } catch (e) { /* not this browser's name for it */ }
  }
  return "";
}

// ComfyUI answers /system_stats when it's up. Its reply can't be read from
// here (it doesn't allow other sites to), but that it answered at all is enough.
async function answers(wait) {
  let host = "";
  try { host = new URL(to).hostname; } catch (e) { return false; }
  const opts = { mode: "no-cors", cache: "no-store" };
  // an address on your network (not this computer) has to say so, or Chrome blocks it as insecure
  if (/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)|\.local$/i.test(host)) opts.targetAddressSpace = "local";
  const stop = new AbortController();
  if (wait) { opts.signal = stop.signal; setTimeout(() => stop.abort(), wait); }
  try { await fetch(`${to}/system_stats`, opts); return true; } catch (e) { return false; }
}

let tries = 0, timer = 0, gone = false;
async function look() {
  clearTimeout(timer);
  if (gone) return;
  const asked = await permission();
  if (asked === "prompt" && !tries)
    help(`<p>Your browser will ask whether this site may <b>look for apps on your device</b>. Allow it, and this tab opens ComfyUI by itself as soon as it's running.</p>`);
  // while the browser is asking, the look waits for the answer
  if (await answers(asked === "prompt" ? 0 : 4000)) {
    gone = true;
    say("ComfyUI is up. Opening…", "up");
    return location.replace(target());
  }
  tries++;
  if (asked === "denied") {
    say("Your browser is keeping Gobo from looking for ComfyUI.", "bad");
    help(`<p>Allow <b>local network access</b> for this site (the icon at the left of the address bar), or press <b>Open it now</b> if ComfyUI is already running.</p>`);
  } else if (tries >= 2) {
    say("Waiting for ComfyUI to start…");
    help(`<p>Start ComfyUI: open the <b>ComfyUI</b> desktop app, or run <code>python main.py</code> in its folder. This tab opens it as soon as it answers.</p>
      <p>Is it running already? It may be at a different address (the desktop app is usually <code>http://127.0.0.1:8000</code>), or your browser may not let a website look: press <b>Open it now</b>.</p>`);
    $("#now").classList.add("go");
  }
  timer = setTimeout(look, 1500);
}

function show() { $("#where").textContent = to; $("#addrIn").value = to; }

if (!gobo || !/^https?:\/\//.test(to)) {
  say("There's nothing to open here.", "bad");
  help(`<p>Go back to Gobo and press <b>Open in ComfyUI</b> again.</p>`);
  $(".row").classList.add("hidden");
} else {
  show();
  look();
}
$("#now").onclick = () => { location.assign(target()); };
$("#change").onclick = () => { $("#addr").classList.toggle("hidden"); $("#addrIn").focus(); };
function useAddress() {
  const a = $("#addrIn").value.trim().replace(/\/+$/, "");
  if (!/^https?:\/\//.test(a)) return $("#addrIn").focus();
  to = a;
  try { localStorage.setItem(STORE, a); } catch (e) { /* asked again next time */ }
  H.set("to", a);
  history.replaceState(null, "", `#${H.toString()}`);
  $("#addr").classList.add("hidden");
  tries = 0; gone = false; show(); say("Looking for ComfyUI…"); help(""); $("#now").classList.remove("go");
  look();
}
$("#addrGo").onclick = useAddress;
$("#addrIn").onkeydown = e => { if (e.key === "Enter") useAddress(); };
// back from a ComfyUI that wasn't there yet: keep looking
addEventListener("pageshow", e => { if (e.persisted && gobo) { gone = false; look(); } });
</script>
</body>
</html>
